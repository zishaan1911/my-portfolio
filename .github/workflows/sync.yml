name: Sync live data

# Refreshes the live parts of index.html: the activity feed, the repo list,
# the contribution heatmap, language stats and the ranking numbers.
# See scripts/sync.mjs for what it does and why.
#
# Needs one repository secret, GROQ_API_KEY (https://console.groq.com/keys).
# Without it everything still syncs; only new descriptions and feed lines
# aren't written.

on:
  schedule:
    - cron: '17 1,13 * * *' # twice a day; off the hour, when Actions is less busy
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'scripts/**'
      - '.github/workflows/sync.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the caches and regenerate every description and feed line'
        type: boolean
        default: false

concurrency:
  group: sync-live-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the guard and the renderer
        # This is the code that stops the model publishing invented figures.
        # If it's broken, generate nothing.
        run: npm test

      - name: Sync
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          SYNC_BUDGET: 30
          SYNC_FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: node scripts/sync.mjs

      - name: Commit if the page changed
        if: ${{ !cancelled() }}
        env:
          MESSAGE: ${{ steps.sync.outputs.message }}
        run: |
          if [ -z "$(git status --porcelain -- index.html sitemap.xml data)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml data
          git commit -m "${MESSAGE:-chore(sync): refresh} [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Fail loudly if the model is unusable
        # A revoked key or a retired model should be an email, not a feed
        # that silently stops updating for weeks.
        if: ${{ steps.sync.outcome == 'failure' }}
        run: |
          echo "::error::The sync step failed. See its log and the job summary."
          exit 1
